name: Validate Data

on:
  push:
    paths:
      - "data/readings.json"
      - "data/config.json"
  pull_request:
    paths:
      - "data/readings.json"
      - "data/config.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate data/readings.json shape
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const readingsPath = path.join(process.env.GITHUB_WORKSPACE, 'data', 'readings.json');
            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'data', 'config.json');

            function fail(message) {
              core.setFailed(message);
            }

            let readings;
            try {
              readings = JSON.parse(fs.readFileSync(readingsPath, 'utf8'));
            } catch (e) {
              return fail(`data/readings.json is not valid JSON: ${e.message}`);
            }

            if (!Array.isArray(readings)) {
              return fail('data/readings.json must be a JSON array');
            }

            const requiredStringFields = ['id', 'date', 'time', 'period'];
            const requiredBoolFields = ['afterRescue'];
            const READING_MIN = 60;
            const READING_MAX = 800;

            function to24Hour(time, period) {
              const match = time.match(/^(\d{1,2}):([0-5]\d)$/);
              if (!match) return null;
              let h = Number(match[1]);
              const mm = match[2];
              if (h < 1 || h > 23) return null;
              if (h >= 13) return { hh: String(h).padStart(2, '0'), mm };
              if (period === 'PM' && h !== 12) h += 12;
              if (period === 'AM' && h === 12) h = 0;
              return { hh: String(h).padStart(2, '0'), mm };
            }

            function isRealDate(s) {
              if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
              const y = Number(s.slice(0, 4));
              const m = Number(s.slice(5, 7));
              const d = Number(s.slice(8, 10));
              const dt = new Date(Date.UTC(y, m - 1, d));
              return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
            }

            readings.forEach((entry, i) => {
              const where = `Entry ${i} (${entry.id || 'unknown'})`;

              if (!Array.isArray(entry.readings) || entry.readings.length !== 3) {
                fail(`${where} must have exactly 3 readings`);
              } else if (entry.readings.some((n) => !Number.isInteger(n))) {
                fail(`${where} readings must be whole numbers`);
              } else if (entry.readings.some((n) => n < READING_MIN || n > READING_MAX)) {
                fail(`${where} has a reading outside the plausible range (${READING_MIN}-${READING_MAX} L/min)`);
              }

              if (typeof entry.best !== 'number' || !Number.isInteger(entry.best)) {
                fail(`${where} "best" must be a whole number`);
              } else if (entry.best < READING_MIN || entry.best > READING_MAX) {
                fail(`${where} "best" (${entry.best}) is outside the plausible range (${READING_MIN}-${READING_MAX} L/min)`);
              } else if (Array.isArray(entry.readings) && entry.best !== Math.max(...entry.readings)) {
                fail(`${where} "best" (${entry.best}) does not match the highest reading (${Math.max(...entry.readings)})`);
              }

              for (const field of requiredStringFields) {
                if (typeof entry[field] !== 'string' || entry[field].length === 0) {
                  fail(`${where} is missing string field "${field}"`);
                }
              }
              if (!isRealDate(entry.date)) {
                fail(`${where} "date" (${entry.date}) must be a real date in YYYY-MM-DD format`);
              }
              if (entry.period !== 'AM' && entry.period !== 'PM') {
                fail(`${where} "period" (${entry.period}) must be AM or PM`);
              }
              const to24 = to24Hour(entry.time, entry.period);
              if (!to24) {
                fail(`${where} "time" (${entry.time}) must be HH:MM (12-hour with AM/PM, or 24-hour)`);
              }
              if (entry.id !== `${entry.date}T${to24 ? to24.hh : '??'}:${to24 ? to24.mm : '??'}:00Z`) {
                fail(`${where} "id" (${entry.id}) must equal the date/time in UTC (${entry.date}T${to24 ? to24.hh : '??'}:${to24 ? to24.mm : '??'}:00Z)`);
              }

              for (const field of requiredBoolFields) {
                if (typeof entry[field] !== 'boolean') {
                  fail(`${where} is missing boolean field "${field}"`);
                }
              }
              if (!entry.symptoms || typeof entry.symptoms !== 'object') {
                fail(`${where} is missing "symptoms" object`);
              }
            });

            if (fs.existsSync(configPath)) {
              let config;
              try {
                config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
              } catch (e) {
                return fail(`data/config.json is not valid JSON: ${e.message}`);
              }
              const zones = config.zones || {};
              if (typeof zones.green?.min !== 'number' || typeof zones.yellow?.min !== 'number' || typeof zones.red?.max !== 'number') {
                fail('data/config.json "zones" is missing required numeric thresholds');
              }
              if (!Array.isArray(config.allowedUsers) || config.allowedUsers.length === 0 || config.allowedUsers.some((u) => typeof u !== 'string' || u.trim() === '')) {
                fail('data/config.json "allowedUsers" must be a non-empty array of usernames — an empty/missing list would lock everyone out of Ingest Reading');
              }
              if (!Number.isInteger(config.schemaVersion) || config.schemaVersion < 1) {
                fail('data/config.json "schemaVersion" must be a positive integer');
              }
            }

            if (!core.summary) return;
            console.log(`Validated ${readings.length} reading entries.`);
