name: Ingest Reading

on:
  issues:
    types: [opened]

concurrency:
  group: ingest-reading
  cancel-in-progress: false

permissions:
  issues: write
  contents: write

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'reading')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check authorization
        id: auth
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Editable list of GitHub usernames allowed to submit readings
            // (case-insensitive) — see the "allowedUsers" field in data/config.json.
            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'data', 'config.json');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            const allowed = (config.allowedUsers || []).map((s) => s.trim().toLowerCase()).filter(Boolean);

            const author = context.payload.issue.user.login.toLowerCase();
            const authorized = allowed.includes(author);
            core.setOutput('authorized', String(authorized));

            if (!authorized) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: 'This repo only accepts readings from authorized submitters. Closing this issue.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
            }

      - name: Parse reading and append entry
        if: steps.auth.outputs.authorized == 'true'
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const body = context.payload.issue.body || '';

            function extractField(label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(`### ${escaped}\\s*\\n\\n([\\s\\S]*?)(?=\\n### |$)`, 'i');
              const m = body.match(re);
              if (!m) return '';
              const value = m[1].trim();
              return value === '_No response_' ? '' : value;
            }

            function toNumber(raw) {
              if (raw === '' || raw === null || raw === undefined) return null;
              const n = Number(raw);
              return Number.isFinite(n) ? n : null;
            }

            function symptomChecked(commaSeparatedText, name) {
              const items = commaSeparatedText
                .split(',')
                .map((s) => s.trim().toLowerCase())
                .filter(Boolean);
              return items.includes(name.toLowerCase());
            }

            function to24Hour(time, period) {
              const match = time.match(/^(\d{1,2}):([0-5]\d)$/);
              if (!match) return null;
              let h = Number(match[1]);
              const mm = match[2];
              if (h < 1 || h > 23) return null;
              if (h >= 13) return { hh: String(h).padStart(2, '0'), mm };
              if (period === 'PM' && h !== 12) h += 12;
              if (period === 'AM' && h === 12) h = 0;
              return { hh: String(h).padStart(2, '0'), mm };
            }

            function isRealDate(s) {
              if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
              const y = Number(s.slice(0, 4));
              const m = Number(s.slice(5, 7));
              const d = Number(s.slice(8, 10));
              const dt = new Date(Date.UTC(y, m - 1, d));
              return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
            }

            const date = extractField('Date').trim();
            const time = extractField('Time').trim();
            const period = extractField('AM / PM').trim().toUpperCase();
            const reading1 = toNumber(extractField('Reading 1 (L/min)'));
            const reading2 = toNumber(extractField('Reading 2 (L/min)'));
            const reading3 = toNumber(extractField('Reading 3 (L/min)'));
            const afterRescueRaw = extractField('Were the readings above taken after using a rescue inhaler?').trim().toLowerCase();
            const symptomsBlock = extractField('Symptoms');
            const notes = extractField('Notes');

            const READING_MIN = 60;
            const READING_MAX = 800;
            const readingsRaw = [reading1, reading2, reading3];

            const errors = [];

            readingsRaw.forEach((r, i) => {
              const label = `Reading ${i + 1}`;
              if (r === null || !Number.isInteger(r)) {
                errors.push(`${label} must be a whole number (got ${r === null ? 'nothing' : r})`);
              } else if (r < READING_MIN || r > READING_MAX) {
                errors.push(`${label} (${r}) is outside the plausible range (${READING_MIN}-${READING_MAX} L/min)`);
              }
            });

            if (!isRealDate(date)) {
              errors.push(`Date "${date}" must be a real date in YYYY-MM-DD format`);
            }

            if (period !== 'AM' && period !== 'PM') {
              errors.push(`AM / PM must be AM or PM (got "${period}")`);
            }

            const to24 = to24Hour(time, period);
            if (!to24) {
              errors.push(`Time "${time}" must be HH:MM (12-hour with AM/PM, or 24-hour)`);
            }

            if (afterRescueRaw !== 'yes' && afterRescueRaw !== 'no') {
              errors.push('After rescue answer must be Yes or No');
            }

            if (errors.length > 0) {
              const body = `Couldn't log this reading:\n\n${errors.map((e) => `- ${e}`).join('\n')}\n\nPlease check the values and open a new issue with the corrected ones.`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
              });
              core.setOutput('appended', 'false');
              return;
            }

            const readings = readingsRaw;
            const best = Math.max(...readings);
            const afterRescue = afterRescueRaw === 'yes';

            const configPath = path.join(process.env.GITHUB_WORKSPACE, 'data', 'config.json');
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            const GREEN_MIN = config.zones.green.min;
            const YELLOW_MIN = config.zones.yellow.min;

            function zoneFor(value) {
              if (value >= GREEN_MIN) return 'green';
              if (value >= YELLOW_MIN) return 'yellow';
              return 'red';
            }

            const zone = zoneFor(best);

            const { hh, mm } = to24;
            const id = `${date}T${hh}:${mm}:00Z`;

            const entry = {
              id,
              date,
              time,
              period,
              readings,
              best,
              afterRescue,
              symptoms: {
                cough: symptomChecked(symptomsBlock, 'Cough'),
                wheeze: symptomChecked(symptomsBlock, 'Wheeze'),
                nighttimeAwakening: symptomChecked(symptomsBlock, 'Nighttime awakening'),
                notes,
              },
            };

            const dataPath = path.join(process.env.GITHUB_WORKSPACE, 'data', 'readings.json');
            const existing = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
            existing.push(entry);
            existing.sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
            fs.writeFileSync(dataPath, JSON.stringify(existing, null, 2) + '\n');

            core.setOutput('appended', 'true');
            core.setOutput('best', String(best));
            core.setOutput('zone', zone);
            core.setOutput('afterRescue', String(afterRescue));

      - name: Commit and push
        if: steps.auth.outputs.authorized == 'true' && steps.process.outputs.appended == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/readings.json
          git commit -m "Log reading: issue #${{ github.event.issue.number }}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main; then
              break
            fi
            sleep 2
          done
          git push

      - name: Comment and close
        if: steps.auth.outputs.authorized == 'true' && steps.process.outputs.appended == 'true'
        uses: actions/github-script@v7
        env:
          BEST: ${{ steps.process.outputs.best }}
          ZONE: ${{ steps.process.outputs.zone }}
          AFTER_RESCUE: ${{ steps.process.outputs.afterRescue }}
        with:
          script: |
            const best = process.env.BEST;
            const zone = process.env.ZONE;
            const afterRescue = process.env.AFTER_RESCUE === 'true';

            const zoneCopy = {
              green: `Logged: ${best} L/min — Green zone ✅`,
              yellow: `⚠️ ${best} L/min — Yellow zone, watch closely. If this persists, consider rescue medication and a call to the doctor.`,
              red: `🚨 ${best} L/min — Red zone. Use rescue inhaler immediately and contact your doctor or ER.`,
            };

            let body = zoneCopy[zone] || `Logged: ${best} L/min`;

            if (afterRescue) {
              body += `\n\n(Logged as taken after rescue inhaler use.)`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
